<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f6">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png">
  <script defer src="./offline.js?v=20261011-1"></script>
  <title>ZUOSEN · 手机端演示</title>
  <link rel="icon" href="./assets/zuosen-brand-square.jpg" type="image/jpeg">
  <style>
    :root {
      --paper: #fff;
      --canvas: #f3f2ef;
      --ink: #292825;
      --muted: #77746e;
      --line: #e3e1dc;
      --soft: #f6f5f2;
      --brand: #d52027;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--ink); background: var(--canvas); }
    body { height: 100dvh; display: flex; flex-direction: column; }
    ::selection { color: var(--ink); background: #eee4df; }
    button, a { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid #8a7564; outline-offset: 3px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 24px; background: var(--paper); border-bottom: 1px solid var(--line); padding: 14px 28px; flex-shrink: 0; }
    .title { min-width: 0; display: grid; grid-template-columns: 115px minmax(0, 1fr); gap: 0 20px; align-items: center; }
    .title > img { grid-row: span 2; object-fit: contain; }
    .title p { grid-column: 2; }
    h1 { font-size: 17px; line-height: 1.4; margin: 0; font-weight: 650; letter-spacing: -.3px; }
    .title p { font-size: 12px; color: var(--muted); margin: 4px 0 0; }
    .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .sizes { display: flex; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); gap: 2px; }
    .sizes button { position: relative; min-width: 57px; min-height: 44px; border: 1px solid transparent; border-radius: 5px; background: transparent; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; transition: background-color 140ms ease, color 140ms ease; }
    .sizes button[aria-pressed=true] { border-color: var(--line); background: var(--paper); color: var(--ink); font-weight: 600; }
    .sizes button[aria-pressed=true]::after { content: ""; position: absolute; right: 20px; bottom: 4px; left: 20px; height: 2px; border-radius: 1px; background: var(--brand); }
    .action { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 7px; padding: 10px 14px; border: 1px solid #d8d5ce; background: var(--paper); color: #514e48; text-decoration: none; font-size: 12px; font-weight: 550; white-space: nowrap; transition: background-color 140ms ease, border-color 140ms ease; }
    .action.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .stage { min-height: 0; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 16px; overflow: auto; }
    .device-space { position: relative; flex-shrink: 0; }
    .device { position: absolute; top: 0; left: 0; background: #2c2b28; padding: 10px; border-radius: 36px; transform-origin: top left; box-shadow: 0 2px 4px #27241f0a, 0 18px 44px #27241f14; }
    .device iframe { display: block; border: 0; border-radius: 26px; background: var(--soft); }
    .caption { font-size: 11px; color: var(--muted); text-align: center; margin: 13px 0 0; line-height: 1.5; flex-shrink: 0; font-variant-numeric: tabular-nums; }
    #demo-message { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); max-width: 90vw; padding: 12px 18px; background: var(--ink); color: var(--paper); font-size: 12px; border-radius: 8px; z-index: 2; }
    button:active, .action:active { transform: translateY(1px); }
    [hidden] { display: none !important; }
    @media (hover: hover) and (pointer: fine) {
      .action:hover { background: var(--soft); border-color: #bab6ad; }
      .action.primary:hover { background: #44413c; border-color: #44413c; }
      .sizes button:not([aria-pressed=true]):hover { background: #ebe9e3; color: var(--ink); }
    }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; padding: 16px; gap: 12px; }
      .title { gap: 0 16px; }
      .controls { width: 100%; gap: 8px; }
      .sizes button { min-width: 46px; }
      .sizes button[aria-pressed=true]::after { right: 16px; left: 16px; }
      .action { padding: 10px; font-size: 11px; }
      .stage { padding: 16px 12px 12px; }
      .title p { font-size: 11px; }
      .caption { max-width: 300px; }
      .device { box-shadow: 0 2px 4px #27241f0a, 0 10px 24px #27241f14; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title"><img width="115" height="40" src="./assets/zuosen-logo-transparent.png" alt="ZUOSEN Hydraulic"><h1>ZUOSEN · 手机端演示</h1><p>可点击、填写和导出的手机尺寸工作台。</p></div>
    <div class="controls">
      <div class="sizes" role="group" aria-label="手机屏幕宽度">
        <button data-size="375" aria-pressed="false">375px</button>
        <button data-size="390" aria-pressed="true">390px</button>
        <button data-size="430" aria-pressed="false">430px</button>
      </div>
      <button class="action primary" id="try-demo">体验图册产品示例</button>
      <a class="action" href="./index.html" target="_blank" rel="noopener">打开完整页面</a>
    </div>
  </header>
  <main class="stage" id="stage">
    <div class="device-space" id="device-space"><div class="device" id="device"><iframe id="phone-app" src="./index.html?v=20261011-1" title="PI Studio 手机端，可直接操作" width="390" height="844" allow="web-share"></iframe></div></div>
    <p class="caption" id="size-caption" role="status">390 × 844 · 与桌面版共用本机资料，编辑会自动保存</p>
  </main>
  <div id="demo-message" role="status" hidden></div>
  <script>
    (()=>{
      const frame=document.getElementById('phone-app'),device=document.getElementById('device'),space=document.getElementById('device-space'),stage=document.getElementById('stage'),caption=document.getElementById('size-caption');
      const sizes={375:812,390:844,430:932};let width=390,height=844,timer;
      function fit(){
        const style=getComputedStyle(stage),availableWidth=stage.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight),availableHeight=stage.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-42;
        const scale=Math.min(1,Math.max(.2,availableWidth/(width+20)),Math.max(.2,availableHeight/(height+20)));
        frame.style.width=width+'px';frame.style.height=height+'px';frame.width=width;frame.height=height;
        device.style.width=(width+20)+'px';device.style.height=(height+20)+'px';device.style.transform=`scale(${scale})`;
        space.style.width=((width+20)*scale)+'px';space.style.height=((height+20)*scale)+'px';
        caption.textContent=`${width} × ${height} · 与桌面版共用本机资料，编辑会自动保存`;
      }
      document.querySelectorAll('[data-size]').forEach(button=>button.addEventListener('click',()=>{
        width=Number(button.dataset.size);height=sizes[width];document.querySelectorAll('[data-size]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));fit();
      }));
      document.getElementById('try-demo').addEventListener('click',()=>{
        try{const button=frame.contentDocument?.getElementById('load-demo');if(!button)throw new Error('not ready');button.click();}
        catch(error){const message=document.getElementById('demo-message');message.textContent='请在手机界面右上角「更多」中选择「体验图册产品示例」。';message.hidden=false;clearTimeout(timer);timer=setTimeout(()=>message.hidden=true,5000);}
      });
      window.addEventListener('resize',fit);if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);fit();
    })();
  </script>
</body>
</html>
